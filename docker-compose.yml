services:
  postgres:
    image: postgres:16-alpine
    container_name: job-radar-postgres

    environment:
      POSTGRES_USER: job_radar
      POSTGRES_PASSWORD: job_radar_password
      POSTGRES_DB: job_radar

    ports:
      - "5434:5432"

    volumes:
      - job_radar_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_radar -d job_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: job-radar:local
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://job_radar:job_radar_password@postgres:5432/job_radar}
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

  crawler:
    build: .
    image: job-radar:local
    profiles:
      - crawler
    command:
      - uv
      - run
      - python
      - main.py
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://job_radar:job_radar_password@postgres:5432/job_radar}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  job_radar_postgres_data:
